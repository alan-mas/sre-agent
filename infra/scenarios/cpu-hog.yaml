# Expected root cause: busy loop pinned at its 500m CPU limit (throttled) while requesting only 50m.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-indexer
  namespace: demo
  labels: {app: search-indexer, scenario: cpu-hog}
spec:
  replicas: 1
  selector: {matchLabels: {app: search-indexer}}
  template:
    metadata:
      labels: {app: search-indexer, scenario: cpu-hog}
    spec:
      containers:
        - name: indexer
          image: busybox:1.36
          command: ["sh", "-c", "echo 'INFO reindexing catalog'; while true; do :; done"]
          resources:
            requests: {cpu: 50m, memory: 16Mi}
            limits: {cpu: 500m, memory: 32Mi}

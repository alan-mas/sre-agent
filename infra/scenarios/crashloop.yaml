# Expected root cause: app cannot reach its database (connection refused) -> exits 1 -> CrashLoopBackOff.
# The DEBUG line carries FAKE credentials on purpose: the Log Analyst must redact them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: demo
  labels: {app: payments-api, scenario: crashloop}
spec:
  replicas: 1
  selector: {matchLabels: {app: payments-api}}
  template:
    metadata:
      labels: {app: payments-api, scenario: crashloop}
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "INFO starting payments-api v1.4.2"
              echo "INFO loading config from /etc/payments/config.yaml"
              echo "DEBUG db dsn=postgres://payments:S3cr3t-Pa55@payments-db.demo.svc:5432/payments api_key=sk-test-FAKE0000000000000000 owner=oncall@example.com"
              echo "ERROR failed to connect to postgres at payments-db.demo.svc:5432: connection refused"
              echo "FATAL database unavailable after 3 retries, exiting"
              exit 1
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}

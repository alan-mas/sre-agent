# Healthy baseline workload: the agent must NOT report it as broken.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: demo
  labels: {app: podinfo, scenario: healthy}
spec:
  replicas: 2
  selector: {matchLabels: {app: podinfo}}
  template:
    metadata:
      labels: {app: podinfo, scenario: healthy}
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports: [{containerPort: 9898}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe: {httpGet: {path: /readyz, port: 9898}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 9898}, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: demo
spec:
  selector: {app: podinfo}
  ports: [{port: 80, targetPort: 9898}]

# Expected root cause: NetworkPolicy inventory-api-ingress admits only pods labelled role=checkout on 9898;
# storefront has no such label, so its requests time out and it exits (CrashLoopBackOff).
# DNS works (the name resolves) and inventory-api is healthy with ready endpoints: the traffic is dropped.
# Fix: label the client or widen the policy's `from` (config change, PR for the owning team).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: demo
  labels: {app: inventory-api, scenario: netpol-deny}
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory-api}}
  template:
    metadata:
      labels: {app: inventory-api, scenario: netpol-deny}
    spec:
      containers:
        - name: api
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports: [{containerPort: 9898}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe: {httpGet: {path: /readyz, port: 9898}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  namespace: demo
  labels: {scenario: netpol-deny}
spec:
  selector: {app: inventory-api}
  ports: [{port: 80, targetPort: 9898}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory-api-ingress
  namespace: demo
  labels: {scenario: netpol-deny}
spec:
  podSelector: {matchLabels: {app: inventory-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {role: checkout}}
      ports: [{protocol: TCP, port: 9898}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: demo
  labels: {app: storefront, scenario: netpol-deny}
spec:
  replicas: 1
  selector: {matchLabels: {app: storefront}}
  template:
    metadata:
      labels: {app: storefront, scenario: netpol-deny}
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "INFO storefront starting, upstream http://inventory-api.demo.svc/readyz"
              for i in 1 2 3; do
                if wget -q -T 3 -O /dev/null http://inventory-api.demo.svc/readyz; then echo "INFO upstream ok"; sleep 3600; fi
                echo "ERROR GET http://inventory-api.demo.svc/readyz failed: download timed out (attempt $i/3)"
              done
              echo "FATAL inventory-api unreachable, exiting"
              exit 1
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}

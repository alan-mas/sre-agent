# Expected root cause: HTTPRoute shop sends shop.lab traffic to Service shop-web-v2, which does not exist
# (ResolvedRefs=False, BackendNotFound), so the gateway answers 500 while shop-web pods are healthy.
# Fix: point the backendRef at shop-web (config change, PR). Try it: curl -H 'Host: shop.lab' localhost:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web
  namespace: demo
  labels: {app: shop-web, scenario: route-backend}
spec:
  replicas: 1
  selector: {matchLabels: {app: shop-web}}
  template:
    metadata:
      labels: {app: shop-web, scenario: route-backend}
    spec:
      containers:
        - name: web
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports: [{containerPort: 9898}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe: {httpGet: {path: /readyz, port: 9898}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-web
  namespace: demo
  labels: {scenario: route-backend}
spec:
  selector: {app: shop-web}
  ports: [{port: 80, targetPort: 9898}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  namespace: demo
  labels: {scenario: route-backend}
spec:
  parentRefs: [{name: lab, namespace: lab-system}]
  hostnames: [shop.lab]
  rules:
    - backendRefs: [{name: shop-web-v2, port: 80}]

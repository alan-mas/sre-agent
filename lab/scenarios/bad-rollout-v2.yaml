# bad-rollout, revision 2 (broken): readiness probe targets a port nothing listens on -> new pods never Ready, rollout stalls with ProgressDeadlineExceeded while v1 keeps serving. Fix: rollout undo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: demo
  labels: {app: orders-api, scenario: bad-rollout}
  annotations:
    kubernetes.io/change-cause: "release 1.1.0 (readiness on new metrics port)"
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: orders-api}}
  template:
    metadata:
      labels: {app: orders-api, scenario: bad-rollout}
    spec:
      containers:
        - name: api
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports: [{containerPort: 9898}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe: {httpGet: {path: /readyz, port: 9797}, periodSeconds: 5}

# Expected root cause: cluster DNS is down (CoreDNS scaled to 0 by `make break-dns`), so billing-api
# cannot resolve billing-db by name and exits -> CrashLoopBackOff. The database itself is healthy and
# its Service has endpoints. Mirrors PM-007 (runbook RB-008). A real failure, not scripted logs:
# the app really resolves and connects. `make fix-dns` restores CoreDNS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-db
  namespace: demo
  labels: {app: billing-db, scenario: dns-outage}
spec:
  replicas: 1
  selector: {matchLabels: {app: billing-db}}
  template:
    metadata:
      labels: {app: billing-db, scenario: dns-outage}
    spec:
      containers:
        - name: db
          image: busybox:1.36
          # Stand-in for Postgres: accepts TCP connections on 5432.
          command: ["sh", "-c", "echo 'INFO billing-db listening on 5432'; while true; do nc -l -p 5432 -e true; done"]
          ports: [{containerPort: 5432, name: postgres}]
          readinessProbe:
            tcpSocket: {port: 5432}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: billing-db
  namespace: demo
  labels: {app: billing-db, scenario: dns-outage}
spec:
  selector: {app: billing-db}
  ports: [{port: 5432, targetPort: postgres, name: postgres}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: demo
  labels: {app: billing-api, scenario: dns-outage}
spec:
  replicas: 1
  selector: {matchLabels: {app: billing-api}}
  template:
    metadata:
      labels: {app: billing-api, scenario: dns-outage}
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "INFO starting billing-api v2.0.1"
              host=billing-db.demo.svc.cluster.local
              if ! nslookup "$host" >/tmp/dns 2>&1; then
                echo "ERROR lookup $host failed: $(tail -n 2 /tmp/dns | tr '\n' ' ')"
                echo "FATAL cannot resolve database host, exiting"
                exit 1
              fi
              if ! nc -z -w 3 "$host" 5432; then
                echo "FATAL database unreachable at $host:5432, exiting"
                exit 1
              fi
              echo "INFO connected to $host:5432; serving"
              while true; do sleep 3600; done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}

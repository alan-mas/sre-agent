# Expected root cause: the HPA cannot compute CPU utilization because quote-api declares no CPU request
# (ScalingActive=False, FailedGetResourceMetric "missing request for cpu"), so it never scales out under load.
# Utilization is usage / request: without a request there is no denominator. Fix: add requests (config change, PR).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-api
  namespace: demo
  labels: {app: quote-api, scenario: hpa-no-requests}
spec:
  replicas: 1
  selector: {matchLabels: {app: quote-api}}
  template:
    metadata:
      labels: {app: quote-api, scenario: hpa-no-requests}
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c"]
          # Steady CPU work so `kubectl top` shows real usage the HPA should react to.
          args:
            - |
              echo "INFO quote-api serving"
              while true; do i=0; while [ $i -lt 20000 ]; do i=$((i+1)); done; sleep 0.2; done
          # No resources on purpose: limits would default the request and hide the failure.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quote-api
  namespace: demo
  labels: {scenario: hpa-no-requests}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: quote-api}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}

# Retrieval query set: ground truth for recall@k and MRR (synthetic).
#
# style:
#   alert     - text shaped like an alert or the agent's own findings
#   question  - a direct question from an SRE
#   paraphrase - the same need in different words, without the document's key terms
#               (tests semantic search; keyword search alone should struggle)
#   exact     - an exact code, message or alert name (tests keyword search; vectors alone may struggle)
#   log       - a raw error line captured from the lab cluster (`kubectl logs --previous`), unedited
# relevant: documents that answer the query, best first. A hit is any of them.
# hard: true when a distractor shares vocabulary with the right answer.

queries:
  # --- crashloop ---
  - id: q01
    style: alert
    query: "KubePodCrashLooping payments-api: container exits with connection refused to payments-db:5432"
    relevant: [RB-001, PM-001]
    hard: true
  - id: q02
    style: question
    query: "How do I debug a pod that keeps restarting with BackOff?"
    relevant: [RB-001]
  - id: q03
    style: question
    query: "Has payments-api crash looped before, and what was the cause?"
    relevant: [PM-001, PM-007]
  - id: q04
    style: paraphrase
    query: "the app dies right after starting because its database is unreachable"
    relevant: [RB-001, PM-001]
  - id: q05
    style: alert
    query: "several services crash looping at the same time, logs say no such host"
    relevant: [RB-008, PM-007]
    hard: true

  # --- oomkilled ---
  - id: q06
    style: exact
    query: "exit code 137"
    relevant: [RB-002]
  - id: q07
    style: alert
    query: "report-worker lastState OOMKilled, restarts rising, limit 64Mi"
    relevant: [RB-002, PM-002]
  - id: q08
    style: paraphrase
    query: "worker gets killed for using too much memory when the monthly job runs"
    relevant: [PM-002, RB-002]
  - id: q09
    style: question
    query: "What is the difference between an OOMKilled container and an evicted pod?"
    relevant: [RB-009, RB-002]
    hard: true

  # --- imagepullbackoff ---
  - id: q10
    style: alert
    query: "checkout-web ImagePullBackOff, Failed event: manifest unknown for tag 9.9.9-does-not-exist"
    relevant: [RB-003, PM-003]
  - id: q11
    style: exact
    query: "ErrImagePull"
    relevant: [RB-003]
  - id: q12
    style: paraphrase
    query: "new pods can't download their container from the registry"
    relevant: [RB-003]
  - id: q13
    style: question
    query: "A release deployed a tag that was never pushed. Should I pick a tag that exists?"
    relevant: [RB-003, PM-003]

  # --- pending ---
  - id: q14
    style: alert
    query: "ml-batch pods Pending, FailedScheduling 0/3 nodes are available: 3 Insufficient cpu"
    relevant: [RB-004, PM-006]
  - id: q15
    style: paraphrase
    query: "a job asks for more processors than any machine in the cluster has"
    relevant: [RB-004, PM-006]
  - id: q16
    style: question
    query: "Pods are Pending and one node shows NotReady. Where do I start?"
    relevant: [RB-007, RB-004]
    hard: true
  - id: q17
    style: exact
    query: "untolerated taint"
    relevant: [RB-004]

  # --- cpu-hog ---
  - id: q18
    style: alert
    query: "search-indexer CPU at 501m with a 500m limit and a 50m request"
    relevant: [RB-005, PM-005]
  - id: q19
    style: exact
    query: "CPUThrottlingHigh"
    relevant: [RB-005, PM-005]
  - id: q20
    style: paraphrase
    query: "service is slow but never restarts and shows no errors; usage is flat at its maximum"
    relevant: [RB-005]
  - id: q21
    style: question
    query: "Will restarting a throttled pod fix the latency?"
    relevant: [RB-005, PM-005]

  # --- bad-rollout ---
  - id: q22
    style: alert
    query: "orders-api ProgressDeadlineExceeded, revision 2 pods 0/1 READY, readiness probe failed connection refused on 9797"
    relevant: [RB-006, PM-004]
    hard: true
  - id: q23
    style: exact
    query: "ProgressDeadlineExceeded"
    relevant: [RB-006]
  - id: q24
    style: question
    query: "When is a rollout undo the right fix instead of editing the deployment?"
    relevant: [RB-006, PM-004]
  - id: q25
    style: paraphrase
    query: "the new version never becomes healthy and the old one is still taking traffic"
    relevant: [RB-006, PM-004]

  # --- distractors as the right answer ---
  - id: q26
    style: alert
    query: "KubeNodeNotReady: kubelet stopped posting node status"
    relevant: [RB-007]
  - id: q27
    style: alert
    query: "pods Evicted: the node was low on resource ephemeral-storage"
    relevant: [RB-009]
  - id: q28
    style: exact
    query: "x509: certificate has expired or is not yet valid"
    relevant: [RB-010, PM-008]
  - id: q29
    style: paraphrase
    query: "every browser shows a security warning but all pods are healthy"
    relevant: [RB-010, PM-008]
  - id: q30
    style: question
    query: "Who owns CoreDNS changes and how should the Corefile be changed?"
    relevant: [PM-007, RB-008]

  # --- postmortem recall (recurrence) ---
  - id: q31
    style: question
    query: "Which past incidents were caused by a skipped manual step?"
    relevant: [PM-001]
  - id: q32
    style: question
    query: "Past incidents where we had no alert or the alert was ignored"
    relevant: [PM-002, PM-005, PM-008, PM-006]
  - id: q33
    style: paraphrase
    query: "pods cannot find the database"
    relevant: [RB-008, PM-007]
    hard: true

  # --- symptom-first queries (round 2). Written before the documents they target, so they
  # do not borrow those documents' wording. q34-q38: an SRE's own words (titles naming the
  # cause removed). All are hard: an older document shares the symptom.
  - id: q34
    style: question
    query: "Our application pods are healthy, but requests to a Kubernetes Service are returning intermittent connection failures. The Service exists and DNS resolution works. How can we investigate whether traffic is reaching the correct pods?"
    relevant: [RB-011, PM-010]
    hard: true
  - id: q35
    style: question
    query: "After deploying a new NetworkPolicy, two microservices can no longer communicate with each other. Both pods are Running and Ready, but TCP connections are timing out. What should we investigate?"
    relevant: [RB-012, PM-009]
    hard: true
  - id: q36
    style: question
    query: "We updated a ConfigMap containing application configuration, but the running pods continue using the old values. How can we determine why the changes aren't being reflected?"
    relevant: [PM-013]
  - id: q37
    style: question
    query: "Applications exposed through our Kubernetes Ingress are experiencing increased response times and intermittent 504 errors. Backend pods appear healthy, and internal service communication works normally. Where should we investigate?"
    relevant: [RB-013, PM-011]
    hard: true
  - id: q38
    style: question
    query: "During a production deployment, several old pods remain stuck in the Terminating state for several minutes. The new replicas are already running, but the old workloads aren't shutting down properly. What should we investigate?"
    relevant: [PM-014]
  - id: q39
    style: paraphrase
    query: "calls between two services hang until the client gives up, and the server never logs the request"
    relevant: [RB-012, PM-009]
    hard: true
  - id: q40
    style: paraphrase
    query: "about one in three requests to the API fails while the rest succeed"
    relevant: [RB-011, PM-010]
    hard: true
  - id: q41
    style: paraphrase
    query: "customers see a gateway timeout page during the sale although every pod is up"
    relevant: [RB-013, PM-011]
    hard: true
  - id: q42
    style: paraphrase
    query: "the worker restarts every minute since the credentials were rotated"
    relevant: [PM-012]
    hard: true
  - id: q43
    style: paraphrase
    query: "looking up internal names sometimes takes exactly five seconds"
    relevant: [PM-015, RB-008]
    hard: true
  - id: q44
    style: paraphrase
    query: "we changed a setting but the app still behaves the old way"
    relevant: [PM-013]
  - id: q45
    style: paraphrase
    query: "the deploy finished but the previous instances keep hanging around for minutes"
    relevant: [PM-014]
  - id: q46
    style: paraphrase
    query: "the database is up but the app says it was refused access"
    relevant: [PM-012]
    hard: true

  # --- real log lines (round 3). Captured from the lab after the Runbook Analyst's first smoke
  # test: the exact DNS error did not retrieve RB-008, a gap the synthetic queries did not show.
  # Only the runbook counts here: it holds the checks and escalation; the postmortem alone does not.
  - id: q47
    style: log
    query: "ERROR lookup billing-db.demo.svc.cluster.local failed: ;; connection timed out; no servers could be reached"
    relevant: [RB-008]
    hard: true
  - id: q48
    style: log
    query: "ERROR failed to connect to postgres at payments-db.demo.svc:5432: connection refused"
    relevant: [RB-001]
    hard: true

  # --- HPA, routes and network policies (added with RB-014 and the lab scenarios of D51) ---
  - id: q49
    style: question
    query: "Our application is experiencing a significant traffic spike, but the Horizontal Pod Autoscaler isn't increasing the replica count despite CPU utilization exceeding its configured target. What could be preventing scaling?"
    relevant: [RB-014]
  - id: q50
    style: log
    query: "failed to get cpu utilization: missing request for cpu in container api of Pod quote-api-554d8995bd-8t2dz"
    relevant: [RB-014]
  - id: q51
    style: paraphrase
    query: "the autoscaler shows an unknown target and never adds pods even though the service is busy"
    relevant: [RB-014, PM-011]
    hard: true
  - id: q52
    style: exact
    query: "HTTPRoute ResolvedRefs False BackendNotFound"
    relevant: [RB-013]
  - id: q53
    style: log
    query: "ERROR GET http://inventory-api.demo.svc/readyz failed: download timed out (attempt 3/3)"
    relevant: [RB-012, PM-009]
    hard: true

  - id: q54
    style: question
    query: "Has an HPA ever been stuck at its maximum replicas during a traffic peak, and what did we change afterwards?"
    relevant: [PM-016]
  - id: q55
    style: paraphrase
    query: "latency jumped with a surge of visitors from a campaign nobody warned us about and the autoscaler could not go higher"
    relevant: [PM-016, RB-014]
    hard: true

# Questions the knowledge base cannot answer (no runbook or postmortem covers them). Not used
# for recall@k; kept for the agent eval, where the right answer is "no runbook for this".
unanswerable:
  - "We're trying to drain a Kubernetes node during scheduled maintenance, but the operation is blocked by a PodDisruptionBudget. How can we safely proceed without affecting application availability?"
  - "Multiple deployment and operational commands are taking unusually long to execute. We're also seeing intermittent timeouts when communicating with the Kubernetes API server. How should we investigate?"
  - "Several pods across different namespaces are experiencing delayed container startup. Kubernetes reports container runtime errors, but the underlying nodes remain Ready. What could be causing this?"
  - "A development team can no longer deploy new workloads into its namespace. Kubernetes reports exceeded quota, even though the cluster still has available CPU and memory capacity. What's happening?"

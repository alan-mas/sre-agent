# Lab cluster (D33, D43): 1 control plane + 2 workers.
# Multi-node so scheduling and node-pressure scenarios behave as in a real cluster.
# The Envoy Gateway service is a NodePort (lab/platform/gateway.yaml); these
# mappings expose it on the host as localhost:8080 (HTTP) and localhost:8443 (HTTPS).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sre-lab
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
